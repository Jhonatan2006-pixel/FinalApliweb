<mat-toolbar class="top-toolbar">
  <button mat-icon-button (click)="sidenavOpen = !sidenavOpen">
    <mat-icon>menu</mat-icon>
  </button>
  <mat-icon class="brand-icon">bolt</mat-icon>
  <span class="brand-name">TaskFlow</span>
  <span class="toolbar-spacer"></span>
  <span class="toolbar-hint">Gestión de proyectos y tareas</span>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav [opened]="sidenavOpen" mode="side" class="sidenav">
    <div class="sidenav-header">
      <mat-icon class="sidenav-logo">bolt</mat-icon>
      <span>TaskFlow</span>
    </div>

    <mat-nav-list class="nav-list">
      <a mat-list-item routerLink="/proyectos" routerLinkActive="nav-active">
        <mat-icon matListItemIcon>folder_open</mat-icon>
        <span matListItemTitle>Proyectos</span>
      </a>
      <a mat-list-item routerLink="/tareas" routerLinkActive="nav-active">
        <mat-icon matListItemIcon>assignment</mat-icon>
        <span matListItemTitle>Tareas</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
    <div class="page-shell">
      <div class="page-content">
        <router-outlet />
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
